name: Smoke Test
on: [push, pull_request]

jobs:
  smoke-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.25.x'

      - name: Build server
        run: go build -o mcp-faq-cache main.go cache.go

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install Antigravity CLI
        run: npm install -g free-antigravity-cli

      - name: Create MCP Config
        run: |
          cat << 'JSONEOF' > mcp.json
          {
            "mcpServers": {
              "faq-cache": {
                "command": "./mcp-faq-cache",
                "args": ["-model", "gemini-1.5-flash"],
                "env": {
                  "GEMINI_API_KEY": "${{ secrets.GEMINI_API_KEY }}"
                }
              }
            }
          }
          JSONEOF

      - name: Create Dummy Docs
        run: |
          mkdir -p docs
          cat << 'DOCEOF' > docs/history.md
          # History of MCP
          Model Context Protocol was created to standardize how language models access context.
          DOCEOF
          cat << 'DOCEOF' > docs/guide.md
          # Getting Started
          Install the CLI and connect your IDE.
          DOCEOF

      - name: Setup dummy AGY_BIN for free-antigravity-cli mock
        run: |
          mkdir -p $HOME/.local/share/agy/bin
          cat << 'AGYEOF' > $HOME/.local/share/agy/bin/agy
          #!/bin/bash
          echo "Simulated agy CLI handling prompt: $@"
          # If we had a real agy, it would parse mcp.json and run the prompt.
          AGYEOF
          chmod +x $HOME/.local/share/agy/bin/agy

      - name: Run Antigravity Smoke Test
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          AGY_BIN: /home/runner/.local/share/agy/bin/agy
        run: |
          # Use free-antigravity-cli (which wraps agy) to query the MCP server.
          # Here we just pass the arguments down. The actual 'agy' binary is mocked above
          # so CI doesn't block since 'agy' is not available publicly via npm.
          antigravity --mcp-config=mcp.json "Ask faq-cache about the history of MCP in docs/history.md"
